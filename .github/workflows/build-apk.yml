name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Remove stale library plugin line
        run: |
          sed -i '/libs.plugins.android.library/d' build.gradle.kts
          cat build.gradle.kts

      - name: Build debug APK
        run: |
          set +e
          ./gradlew :app:assembleDebug --console=plain --no-configuration-cache > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            echo "=================== REAL ERROR ==================="
            grep -n -B2 -A25 "What went wrong" build.log | head -80
            echo "=================== COMPILER ERRORS ==================="
            grep -n "^e: \|error:" build.log | head -40
            echo "=================== FIRST 40 LINES ==================="
            head -40 build.log
          fi
          exit $code

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Collect APK
        run: |
          mkdir -p out
          find app/build/outputs/apk -name "*.apk" -exec cp {} out/ \;
          for f in out/*.apk; do mv "$f" "out/LastWave-Offline-${GITHUB_RUN_NUMBER}.apk"; break; done
          ls -lh out

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LastWave-Offline-apk
          path: out/*.apk

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: LastWave Offline build ${{ github.run_number }}
          prerelease: true
          files: out/*.apk
